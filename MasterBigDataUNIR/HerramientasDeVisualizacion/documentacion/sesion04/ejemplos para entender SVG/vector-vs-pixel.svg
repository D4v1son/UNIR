<svg width="600" height="200" viewBox="0 0 600 200"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo -->
  <rect x="0" y="0" width="600" height="200" fill="#f5f5f5" />

  <!-- Título -->
  <text x="250" y="30" text-anchor="middle" font-size="22" font-family="sans-serif">
    Imagen SVG = dibujo con números
  </text>

  <!-- Círculo vectorial: definido por números -->
  <circle cx="150" cy="110" r="60" fill="#4CAF50" />
  <text x="150" y="110" text-anchor="middle" font-size="18" font-family="sans-serif" fill="white">
    SVG
  </text>

  <!-- Texto explicativo bajo el círculo -->
  <text x="150" y="190" text-anchor="middle" font-size="14" font-family="sans-serif">
    Circulo dibujado con codigo
  </text>

  <!-- Cuadrado tipo píxeles (simulación de mapa de bits) -->
  <!-- “Mosaico” de cuadrados pequeños para parecer píxeles -->
  <g transform="translate(360,50)">
    <!-- fila 1 -->
    <rect x="0"  y="0" width="10" height="10" fill="#2196F3" />
    <rect x="10" y="0" width="10" height="10" fill="#2196F3" />
    <rect x="20" y="0" width="10" height="10" fill="#1976D2" />
    <rect x="30" y="0" width="10" height="10" fill="#BBDEFB" />
    <!-- fila 2 -->
    <rect x="0"  y="10" width="10" height="10" fill="#64B5F6" />
    <rect x="10" y="10" width="10" height="10" fill="#1976D2" />
    <rect x="20" y="10" width="10" height="10" fill="#0D47A1" />
    <rect x="30" y="10" width="10" height="10" fill="#BBDEFB" />
    <!-- fila 3 -->
    <rect x="0"  y="20" width="10" height="10" fill="#BBDEFB" />
    <rect x="10" y="20" width="10" height="10" fill="#64B5F6" />
    <rect x="20" y="20" width="10" height="10" fill="#1976D2" />
    <rect x="30" y="20" width="10" height="10" fill="#2196F3" />
    <!-- fila 4 -->
    <rect x="0"  y="30" width="10" height="10" fill="#BBDEFB" />
    <rect x="10" y="30" width="10" height="10" fill="#BBDEFB" />
    <rect x="20" y="30" width="10" height="10" fill="#64B5F6" />
    <rect x="30" y="30" width="10" height="10" fill="#0D47A1" />
  </g>

  <!-- Texto explicativo bajo el “mosaico” -->
  <text x="380" y="190" text-anchor="middle" font-size="14" font-family="sans-serif">
    Pixeles dibujados con codigo
  </text>

</svg>